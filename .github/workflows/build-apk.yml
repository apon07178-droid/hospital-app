name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found zip: $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found!"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: extracted
        run: npm install

      - name: Build web app
        working-directory: extracted
        run: npm run build

      - name: Install Capacitor Android platform
        working-directory: extracted
        run: |
          npm install @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: extracted/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: extracted/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/*.apk
